<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="35" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#textGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-card-rev {
        animation: floatRev 7s ease-in-out infinite alternate;
      }
      .stream-flow {
        stroke-dasharray: 8 8;
        animation: dash 12s linear infinite;
      }

      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.35; }
        100% { transform: scale(1.08); opacity: 0.65; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -160; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Strictly in Background) -->
  <circle cx="200" cy="80" r="140" fill="url(#glowGrad1)" class="pulse-circle" filter="url(#blurGlow)" />
  <circle cx="1020" cy="320" r="160" fill="url(#glowGrad2)" class="pulse-circle" style="animation-delay: -2s;" filter="url(#blurGlow)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated Interconnection Network Lines (Background Layer) -->
  <g stroke="#38bdf8" stroke-width="1.8" opacity="0.35" fill="none">
    <path d="M 80,330 C 250,300 350,370 520,330 S 780,290 940,340 S 1120,300 1150,320" class="stream-flow" />
    <path d="M 50,370 C 280,390 420,320 620,360 S 880,370 1150,340" stroke="#818cf8" stroke-width="1.5" opacity="0.25" class="stream-flow" style="animation-duration: 18s;" />
  </g>

  <!-- Dynamic Network Connection Nodes (Lower Background) -->
  <g opacity="0.6">
    <circle cx="220" cy="335" r="5" fill="#38bdf8" />
    <circle cx="480" cy="340" r="4" fill="#818cf8" />
    <circle cx="750" cy="315" r="6" fill="#c084fc" />
    <circle cx="980" cy="335" r="5" fill="#38bdf8" />
  </g>

  <!-- Dynamic Floating Decorative Feature Badges / Cards (Lower Corners - Safe Zones) -->
  <g class="float-card" transform="translate(860, 45)">
    <rect width="270" height="70" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
    <circle cx="36" cy="35" r="16" fill="#0284c7" fill-opacity="0.3" />
    <circle cx="36" cy="35" r="7" fill="#38bdf8" />
    <text x="64" y="32" class="badge-text" font-size="14" fill="#f8fafc">SaaS &amp; Self-Hosted</text>
    <text x="64" y="52" class="subtitle-text" font-size="12" fill="#64748b">Complete Ecosystem Matrix</text>
  </g>

  <g class="float-card-rev" transform="translate(70, 45)">
    <rect width="250" height="70" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
    <circle cx="36" cy="35" r="16" fill="#7c3aed" fill-opacity="0.3" />
    <circle cx="36" cy="35" r="7" fill="#a855f7" />
    <text x="64" y="32" class="badge-text" font-size="14" fill="#f8fafc">Data Sovereignty</text>
    <text x="64" y="52" class="subtitle-text" font-size="12" fill="#64748b">Open-Source &amp; On-Premise</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitle & Interactive Pills (Permanently Clear & Distinct) -->
  <g id="foreground-content" transform="translate(0, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(435, 90)">
      <rect width="330" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="22" class="badge-text" fill="#cbd5e1" font-size="12">ENTERPRISE COLLABORATION &amp; INTRANET</text>
    </g>

    <!-- Main Prominent Heading -->
    <text x="600" y="180" text-anchor="middle" class="title-text">Awesome Enterprise Social Network &amp; Intranet</text>

    <!-- Subtitle -->
    <text x="600" y="225" text-anchor="middle" class="subtitle-text">Curated Directory of Modern Employee Communities, Internal Comms &amp; Social Workspaces</text>

    <!-- Feature Attribute Pills (Foreground Navigation Row) -->
    <g transform="translate(260, 260)">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(0, 0)">
        <rect width="150" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="75" y="22" text-anchor="middle" class="badge-text" fill="#38bdf8">🌐 Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source Intranets -->
      <g transform="translate(162, 0)">
        <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
        <text x="90" y="22" text-anchor="middle" class="badge-text" fill="#818cf8">💻 Open-Source Hubs</text>
      </g>
      <!-- Pill 3: Employee Experience -->
      <g transform="translate(354, 0)">
        <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" />
        <text x="82" y="22" text-anchor="middle" class="badge-text" fill="#c084fc">🤝 Employee Comms</text>
      </g>
      <!-- Pill 4: Pricing & Tiers -->
      <g transform="translate(531, 0)">
        <rect width="145" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
        <text x="72" y="22" text-anchor="middle" class="badge-text" fill="#34d399">📊 Transparent Tiers</text>
      </g>
    </g>
  </g>
</svg>
